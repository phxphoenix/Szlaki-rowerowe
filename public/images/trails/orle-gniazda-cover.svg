  <text x="64" y="654" fill="#F8FAF7" fill-opacity="0.92" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" letter-spacing="3">ORLE GNIAZDA</text>
  <text x="64" y="688" fill="#96A4B2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" letter-spacing="2">JURA KRAKOWSKO-CZĘSTOCHOWSKA</text>
