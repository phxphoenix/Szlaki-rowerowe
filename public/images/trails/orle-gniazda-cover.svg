    <path d="M -50 460 Q 250 340 540 410 T 1250 310" />
    <path d="M -50 500 Q 270 380 560 445 T 1250 355" />
    <path d="M -50 540 Q 290 420 580 480 T 1250 400" />
    <path d="M -50 580 Q 310 460 600 515 T 1250 445" />
    <path d="M -50 220 Q 380 120 720 200 T 1250 110" />
    <path d="M -50 260 Q 390 165 740 240 T 1250 155" />
