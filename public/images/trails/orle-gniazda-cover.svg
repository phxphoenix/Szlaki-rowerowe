  <path d="M 0 750 L 0 520 L 180 410 L 360 480 L 570 330 L 780 430 L 980 290 L 1200 390 L 1200 750 Z" fill="url(#ridge1)" />
  <path d="M 0 750 L 0 600 L 220 530 L 440 575 L 680 470 L 920 535 L 1200 450 L 1200 750 Z" fill="#11161A" fill-opacity="0.55" />

  <!-- Accent glow orb -->
  <circle cx="960" cy="180" r="160" fill="#DC2626" fill-opacity="0.14" />

