  <path d="M 120 560 C 260 510, 340 350, 520 370 C 690 390, 760 220, 940 240 C 1020 250, 1080 210, 1110 175" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="10" stroke-linecap="round" />
  <path d="M 120 560 C 260 510, 340 350, 520 370 C 690 390, 760 220, 940 240 C 1020 250, 1080 210, 1110 175" fill="none" stroke="url(#glow)" stroke-width="5" stroke-linecap="round" />

  <!-- Start / End Telemetry Waypoints -->
  <circle cx="120" cy="560" r="11" fill="#16A34A" stroke="#FFFFFF" stroke-width="3" />
  <circle cx="1110" cy="175" r="11" fill="#FF4D1C" stroke="#FFFFFF" stroke-width="3" />

  <!-- Minimal Corner Telemetry Framing -->
  <g stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2" fill="none">
    <path d="M 48 84 L 48 48 L 84 48" />
    <path d="M 1116 48 L 1152 48 L 1152 84" />
    <path d="M 48 666 L 48 702 L 84 702" />
    <path d="M 1116 702 L 1152 702 L 1152 666" />
