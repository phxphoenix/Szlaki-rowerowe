<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="ORLE GNIAZDA">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181414" />
      <stop offset="100%" stop-color="#2C221E" />
    </linearGradient>
    <linearGradient id="ridge1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#181414" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4D1C" />
      <stop offset="100%" stop-color="#FF8A4C" />
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)" />
  <rect width="1200" height="750" fill="url(#grid)" />

  <!-- Topographic contour isolines -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1.5">
    <path d="M -50 500 Q 250 380 540 450 T 1250 350" />
    <path d="M -50 540 Q 270 420 560 485 T 1250 395" />
    <path d="M -50 580 Q 290 460 580 520 T 1250 440" />
    <path d="M -50 620 Q 310 500 600 555 T 1250 485" />
    <path d="M -50 180 Q 380 80 720 160 T 1250 70" />
    <path d="M -50 220 Q 390 125 740 200 T 1250 115" />
  </g>

  <!-- Stylized Alpine / Terrain Silhouettes -->
  <path d="M 0 750 L 0 560 L 180 450 L 360 520 L 570 370 L 780 470 L 980 330 L 1200 430 L 1200 750 Z" fill="url(#ridge1)" />
  <path d="M 0 750 L 0 600 L 220 530 L 440 575 L 680 470 L 920 535 L 1200 450 L 1200 750 Z" fill="#11161A" fill-opacity="0.55" />

  <!-- Accent glow orb -->
  <circle cx="1000" cy="140" r="160" fill="#DC2626" fill-opacity="0.14" />

  <!-- Route Polyline with contrast halo -->
  <path d="M 90 500 C 250 420, 410 460, 580 320 C 730 200, 880 280, 1090 190" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="10" stroke-linecap="round" />
  <path d="M 90 500 C 250 420, 410 460, 580 320 C 730 200, 880 280, 1090 190" fill="none" stroke="url(#glow)" stroke-width="5" stroke-linecap="round" />

  <!-- Start / End Telemetry Waypoints -->
  <circle cx="90" cy="500" r="11" fill="#16A34A" stroke="#FFFFFF" stroke-width="3" />
  <circle cx="1090" cy="190" r="11" fill="#FF4D1C" stroke="#FFFFFF" stroke-width="3" />

  <!-- Minimal Corner Telemetry Framing -->
  <g stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2" fill="none">
    <path d="M 48 84 L 48 48 L 84 48" />
    <path d="M 1116 48 L 1152 48 L 1152 84" />
    <path d="M 48 666 L 48 702 L 84 702" />
    <path d="M 1116 702 L 1152 702 L 1152 666" />
  </g>

  <text x="64" y="654" fill="#F8FAF7" fill-opacity="0.92" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" letter-spacing="3">ORLE GNIAZDA</text>
  <text x="64" y="688" fill="#96A4B2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" letter-spacing="2">JURA KRAKOWSKO-CZĘSTOCHOWSKA • SEKTOR 01</text>
